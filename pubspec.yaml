name: kori
description: "Free, open-source, local-first personal finance app. Your data never leaves your phone."
publish_to: 'none'

# Bumped by CI on tagged releases.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- data ---
  drift: ^2.34.3
  drift_flutter: ^0.3.1          # wraps sqlite3_flutter_libs + sqlcipher_flutter_libs

  # --- state & routing ---
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0

  # --- ui ---
  cupertino_icons: ^1.0.9
  fl_chart: ^1.2.0
  intl: ^0.20.3

  # --- on-device scheduling ---
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # --- data ownership: import / export / backup ---
  # file_selector over file_picker: file_picker 11.x pins win32 ^5.9.0, which
  # collides with share_plus 13.x (^6.0.1) and drags unrelated packages down.
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  csv: ^8.0.0
  archive: ^4.0.9                # xlsx is a zip; also used for backup bundles
  xml: ^7.0.1                    # xlsx part authoring/parsing
  # AES-GCM + PBKDF2 for encrypted backups. Pure Dart on purpose — webcrypto
  # builds BoringSSL via CMake, which is a steep ask of contributors for
  # encrypting one backup file.
  cryptography_plus: ^3.0.0

  # --- app lock ---
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Capped by upstream pins, not choice: build_runner >=2.15.2 needs meta
  # ^1.18.3 but Flutter 3.44.9 pins meta 1.18.0, and drift_dev >=2.34.1+1 needs
  # analyzer ^13 which build_runner's test chain caps below. Raise when Flutter
  # ships newer meta.
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
